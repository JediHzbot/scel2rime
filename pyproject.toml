[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scel2rime"
version = "0.1.0"
description = "Convert your own Sogou .scel dictionaries into Rime .dict.yaml, offline and dependency-free."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scel2rime contributors" }]
keywords = ["rime", "sogou", "scel", "input-method", "dictionary", "ime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
scel2rime = "scel2rime.cli:main"

[project.urls]
Homepage = "https://github.com/JediHzbot/scel2rime"
Issues = "https://github.com/JediHzbot/scel2rime/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scel2rime = ["py.typed"]
